model:
  model_id: mlx-community/Qwen3-TTS-12Hz-0.6B-Base-8bit
  model_type: qwen3_tts

trainer:
  num_epochs: 3
  batch_size: 1
  grad_accumulation: 16
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 50
  max_grad_norm: 1.0
  save_every: 50
  log_every: 5
  output_dir: checkpoints/qwen3-speaker

processor:
  include_ref_mel: true
  speaker_name: my_telugu_voice
  sample_rate: 24000
  max_audio_len: 30.0
  min_audio_len: 1.0

data:
  train_jsonl: data/speaker/train.jsonl
  preprocessed_dir: data/speaker/preprocessed
